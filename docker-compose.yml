services:
  admin-panel:
    image: ${ADMIN_PANEL_IMAGE:-ghcr.io/godarai-ir/librechat-admin-panel:latest}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: .env
    environment:
      - PORT=${PORT:-3000}
